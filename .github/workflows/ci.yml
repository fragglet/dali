name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:  # Weekly build
    - cron: "15 3 * * 1"

jobs:
  watcom_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -q install dosbox
    - name: Find Git version
      id: version
      run: |
        if git describe --exact-match --tags >/dev/null; then
          VERSION=$(git describe --exact-match --tags)
          VERSION=${VERSION/#v/}
        else
          VERSION=$(git rev-parse --short HEAD)
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
    - name: build
      timeout-minutes: 20
      run: |
        ./build/watbuild.sh
        ./mkrelease.sh ${{steps.version.outputs.VERSION}}
    - name: Upload EXEs
      uses: actions/upload-artifact@v7
      with:
        name: dali-${{steps.version.outputs.VERSION}}
        path: dali-${{steps.version.outputs.VERSION}}.zip
        archive: false
